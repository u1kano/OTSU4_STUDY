<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>危険物乙4 模擬試験</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col justify-between">
<!-- Header -->
<header class="bg-indigo-600 text-white p-4 sticky top-0 z-10 shadow-md">
<h1 class="text-lg font-bold text-center">危険物乙4 模擬試験</h1>
<p class="text-xs text-center text-indigo-200 mt-1" id="progress-info">読み込み中...</p>
</header>

<!-- Main Content Area -->
<main class="p-4 flex-1 overflow-y-auto" id="main-content">
<!-- Quiz Screen -->
<div id="quiz-screen">
<div class="mb-4">
<span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded" id="question-tag">-</span>
<h2 class="text-base font-semibold mt-2 text-slate-900 leading-relaxed whitespace-pre-wrap" id="question-text">データを読み込んでいます...</h2>
</div>
<div class="space-y-3" id="options-container"></div>
</div>

<!-- Result Screen -->
<div id="result-screen" class="hidden">
<div class="text-center py-6">
<h2 class="text-xl font-bold text-slate-800 mb-2">試験結果</h2>
<div class="text-4xl font-extrabold text-indigo-600 mb-2" id="score-display">0 / 0</div>
<p class="text-sm text-slate-600 mb-6" id="pass-fail-text">合格基準: 60%以上</p>
<button onclick="restartQuiz()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:bg-indigo-700 transition">もう一度挑戦する</button>
</div>
<div class="mt-6 border-t pt-4">
<h3 class="font-bold text-slate-800 mb-3">解答と解説</h3>
<div id="review-container" class="space-y-4"></div>
</div>
</div>
</main>

<!-- Footer Navigation -->
<footer class="p-4 bg-white border-t border-slate-100 sticky bottom-0" id="footer-nav">
<div class="flex gap-3">
<button id="prev-btn" onclick="prevQuestion()" class="flex-1 bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl active:bg-slate-300 transition disabled:opacity-50">前へ</button>
<button id="next-btn" onclick="nextQuestion()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl active:bg-indigo-700 transition">次へ</button>
</div>
</footer>
</div>

<script>
// ==========================================
// 設定定数
// ==========================================
// true  : 問題をランダムに抽出する（シャッフルする）
// false : JSONに記述された順番のまま出題する
const RANDOM_QUESTIONS = false; 
// ==========================================

let allQuestions = []; // JSONから読み込んだ全問題
let questions = [];    // 今回出題する問題
let currentIdx = 0;
let userAnswers = [];

// 外部のJSONファイル（questions.json）から問題を読み込む
async function loadQuestions() {
try {
const response = await fetch('questions.json');
if (!response.ok) throw new Error('Network response was not ok');
allQuestions = await response.json();

if (allQuestions.length === 0) {
throw new Error('問題データが空です');
}

startQuiz();
} catch (error) {
document.getElementById('question-text').innerText = "問題データの読み込みに失敗しました。\n(※ローカル環境で開く場合は簡易サーバー等をご利用ください)";
document.getElementById('progress-info').innerText = "エラー";
console.error(error);
}
}

// クイズを開始
function startQuiz() {
const selectCount = Math.min(12, allQuestions.length);

if (RANDOM_QUESTIONS) {
const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
questions = shuffled.slice(0, selectCount);
} else {
questions = allQuestions.slice(0, selectCount);
}

currentIdx = 0;
// 各問題の正解が単一か複数かに関わらず、回答保持用配列を初期化
// 正解が配列形式（複数）の場合は複数選択（配列）として扱えるように準備
userAnswers = new Array(questions.length).fill(null);
renderQuestion();
}

// 共通：正解データを必ず配列の形（例: [1] や [1, 5]）に正規化するヘルパー関数
function getCorrectArray(correct) {
return Array.isArray(correct) ? correct : [correct];
}

// ユーザーの回答が正解と一致しているかを判定する関数
function checkIsCorrect(userAns, correctDef) {
if (userAns === null || userAns === undefined) return false;
const correctArr = getCorrectArray(correctDef);

if (Array.isArray(userAns)) {
// ユーザーも複数選択（配列）の場合：要素が完全に一致しているか
if (userAns.length !== correctArr.length) return false;
return userAns.every(val => correctArr.includes(val)) && correctArr.every(val => userAns.includes(val));
} else {
// ユーザーが単一選択の場合：正解配列の中にその値が含まれているか
return correctArr.length === 1 && correctArr[0] === userAns;
}
}

function renderQuestion() {
if (questions.length === 0) return;
const q = questions[currentIdx];
document.getElementById('progress-info').innerText = `問題 ${currentIdx + 1} / ${questions.length}`;
document.getElementById('question-tag').innerText = q.tag;
document.getElementById('question-text').innerText = q.question;

const container = document.getElementById('options-container');
container.innerHTML = '';

// 正解が複数（correctが配列で要素数2以上）の場合はチェックボックスによる複数選択、
// 正解が1つの場合は従来通りラジオボタンによる単一選択にする
const correctArr = getCorrectArray(q.correct);
const isMultiple = correctArr.length > 1;

q.options.forEach((opt, idx) => {
const userAns = userAnswers[currentIdx];
let isChecked = false;
if (Array.isArray(userAns)) {
isChecked = userAns.includes(idx);
} else {
isChecked = userAns === idx;
}

const div = document.createElement('label');
div.className = `flex items-start p-3 border rounded-xl cursor-pointer transition ${isChecked ? 'border-indigo-600 bg-indigo-50/50' : 'border-slate-200 hover:bg-slate-50'}`;

// 正解が複数ある問題（isMultiple === true）はチェックボックスで表示し、複数選択を可能にする。
// 正解が1つだけの問題は従来通りラジオボタンで単一選択のままにする。
const inputType = isMultiple ? 'checkbox' : 'radio';
const inputName = isMultiple ? `option-${currentIdx}-${idx}` : `option-${currentIdx}`;
const inputClass = isMultiple
? 'mt-1 h-4 w-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500'
: 'mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500';

div.innerHTML = `
<input type="${inputType}" name="${inputName}" value="${idx}" ${isChecked ? 'checked' : ''} onclick="selectOption(${idx})" class="${inputClass}">
<span class="ml-3 text-sm text-slate-700 leading-snug whitespace-pre-wrap">${opt}</span>
`;
container.appendChild(div);
});

document.getElementById('prev-btn').disabled = currentIdx === 0;
const nextBtn = document.getElementById('next-btn');
if (currentIdx === questions.length - 1) {
nextBtn.innerText = "結果を確認する";
nextBtn.onclick = submitQuiz;
} else {
nextBtn.innerText = "次へ";
nextBtn.onclick = nextQuestion;
}
}

function selectOption(idx) {
const q = questions[currentIdx];
const correctArr = getCorrectArray(q.correct);
const isMultiple = correctArr.length > 1;

if (isMultiple) {
// 複数正解の問題：選択済みなら解除、未選択なら追加するトグル方式（配列で保存）
let current = userAnswers[currentIdx];
if (!Array.isArray(current)) {
current = [];
}
const pos = current.indexOf(idx);
if (pos === -1) {
current.push(idx);
} else {
current.splice(pos, 1);
}
userAnswers[currentIdx] = current;
} else {
// 単一正解の問題：従来通り単一選択として保存
userAnswers[currentIdx] = idx;
}
renderQuestion();
}

function nextQuestion() {
if (currentIdx < questions.length - 1) {
currentIdx++;
renderQuestion();
}
}

function prevQuestion() {
if (currentIdx > 0) {
currentIdx--;
renderQuestion();
}
}

function submitQuiz() {
const hasUnanswered = userAnswers.some(a => a === null || (Array.isArray(a) && a.length === 0));
if (hasUnanswered) {
if (!confirm("未回答の問題がありますが、結果を確認しますか？")) {
return;
}
}

let score = 0;
questions.forEach((q, idx) => {
if (checkIsCorrect(userAnswers[idx], q.correct)) {
score++;
}
});

document.getElementById('quiz-screen').classList.add('hidden');
document.getElementById('footer-nav').classList.add('hidden');
document.getElementById('result-screen').classList.remove('hidden');

document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
const percentage = Math.round((score / questions.length) * 100);
document.getElementById('pass-fail-text').innerText = percentage >= 60
? `正答率: ${percentage}% - 合格ライン（60%）クリアです！おめでとうございます！`
: `正答率: ${percentage}% - 合格ライン（60%）までもう少しです！復習して再挑戦しましょう。`;

// 詳細な解説・解答一覧の構築
const reviewContainer = document.getElementById('review-container');
reviewContainer.innerHTML = '';

questions.forEach((q, idx) => {
const userAns = userAnswers[idx];
const isCorrect = checkIsCorrect(userAns, q.correct);
const correctArr = getCorrectArray(q.correct);

const card = document.createElement('div');
card.className = `p-4 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'}`;

let optionsHtml = '';
q.options.forEach((opt, optIdx) => {
const isOptCorrect = correctArr.includes(optIdx);
const isUserOpt = Array.isArray(userAns) ? userAns.includes(optIdx) : userAns === optIdx;

let badge = '';
if (isOptCorrect) badge += '<span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded ml-2">正解</span>';
if (isUserOpt && !isCorrect) badge += '<span class="text-xs bg-rose-600 text-white px-2 py-0.5 rounded ml-2">あなたの回答</span>';

optionsHtml += `<li class="text-xs py-1 leading-relaxed ${isOptCorrect ? 'font-bold text-emerald-800' : 'text-slate-600'}">- ${opt} ${badge}</li>`;
});

card.innerHTML = `
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-bold text-slate-500">問 ${idx + 1}</span>
<span class="text-xs font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${isCorrect ? '正解' : '不正解'}</span>
</div>
<p class="text-sm font-semibold text-slate-800 mb-2 whitespace-pre-wrap">${q.question}</p>
<ul class="mb-3 space-y-1">${optionsHtml}</ul>
<div class="text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100 leading-relaxed">
<span class="font-bold text-slate-700">解説:</span> ${q.explanation}
</div>
`;
reviewContainer.appendChild(card);
});
}

function restartQuiz() {
startQuiz();
document.getElementById('result-screen').classList.add('hidden');
document.getElementById('quiz-screen').classList.remove('hidden');
document.getElementById('footer-nav').classList.remove('hidden');
window.scrollTo({ top: 0, behavior: 'smooth' });
}

// アプリ起動時にデータ読み込みを実行
loadQuestions();
</script>
</body>
</html>
