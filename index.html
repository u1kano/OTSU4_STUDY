<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>危険物乙4 模擬試験</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col justify-between">
<!-- Header -->
<header class="bg-indigo-600 text-white p-4 sticky top-0 z-10 shadow-md">
<h1 class="text-lg font-bold text-center">危険物乙4 模擬試験</h1>
<p class="text-xs text-center text-indigo-200 mt-1" id="progress-info">出題範囲を選択してください</p>
</header>

<!-- Main Content Area -->
<main class="p-4 flex-1 overflow-y-auto" id="main-content">
<!-- Category Select Screen -->
<div id="category-screen">
<h2 class="text-base font-bold text-slate-900 mb-4">出題範囲を選択してください</h2>
<div class="space-y-3" id="category-options">
<label class="flex items-start p-3 border rounded-xl cursor-pointer transition border-indigo-600 bg-indigo-50/50">
<input type="radio" name="category" value="questions.json" checked onclick="updateCategoryHighlight()" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
<span class="ml-3 text-sm text-slate-700 leading-snug">危険物に関する法令</span>
</label>
<label class="flex items-start p-3 border rounded-xl cursor-pointer transition border-slate-200 hover:bg-slate-50">
<input type="radio" name="category" value="questions2.json" onclick="updateCategoryHighlight()" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
<span class="ml-3 text-sm text-slate-700 leading-snug">基礎的な物理学及び基礎的な化学</span>
</label>
<label class="flex items-start p-3 border rounded-xl cursor-pointer transition border-slate-200 hover:bg-slate-50">
<input type="radio" name="category" value="questions3.json" onclick="updateCategoryHighlight()" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
<span class="ml-3 text-sm text-slate-700 leading-snug">危険物の性質・火災予防及び消火方法</span>
</label>
</div>
<hr class="my-5 border-slate-200">
<div class="mb-4">
<label for="range-select" class="block text-sm font-semibold text-slate-700 mb-2">出題箇所</label>
<select id="range-select" class="w-full border border-slate-300 rounded-xl p-3 text-sm text-slate-700 focus:ring-indigo-500 focus:border-indigo-500">
<option value="all">すべて</option>
</select>
</div>
<div class="mb-2">
<label for="count-select" class="block text-sm font-semibold text-slate-700 mb-2">出題数</label>
<select id="count-select" class="w-full border border-slate-300 rounded-xl p-3 text-sm text-slate-700 focus:ring-indigo-500 focus:border-indigo-500">
<option value="5">5問</option>
<option value="10" selected>10問</option>
<option value="15">15問</option>
<option value="20">20問</option>
<option value="25">25問</option>
<option value="30">30問</option>
<option value="35">35問</option>
<option value="40">40問</option>
<option value="45">45問</option>
<option value="50">50問</option>
<option value="all">すべて</option>
</select>
</div>
<hr class="my-5 border-slate-200">
<div class="mb-2">
<label for="check-select" class="block text-sm font-semibold text-slate-700 mb-2">正解確認</label>
<select id="check-select" class="w-full border border-slate-300 rounded-xl p-3 text-sm text-slate-700 focus:ring-indigo-500 focus:border-indigo-500">
<option value="batch">まとめて確認</option>
<option value="each" selected>１問ずつ確認</option>
</select>
</div>
<button onclick="startWithSelectedCategory()" class="w-full mt-6 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:bg-indigo-700 transition">試験を開始する</button>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen" class="hidden">
<div class="mb-4">
<span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded" id="question-tag">-</span>
<h2 class="text-base font-semibold mt-2 text-slate-900 leading-relaxed whitespace-pre-wrap" id="question-text">データを読み込んでいます...</h2>
<!-- 問題画像（JSONに image がある問題のみ表示） -->
<div id="question-image-wrap" class="hidden mt-3">
<img id="question-image" src="" alt="問題の図" class="w-full h-auto rounded-lg border border-slate-200" onerror="this.parentElement.classList.add('hidden')">
</div>
</div>
<div class="space-y-3" id="options-container"></div>
<!-- 1問ずつ確認モード：回答・正解・解説の表示領域 -->
<div id="feedback-container" class="mt-4"></div>
</div>

<!-- Result Screen -->
<div id="result-screen" class="hidden">
<div class="text-center py-6">
<h2 class="text-xl font-bold text-slate-800 mb-2">試験結果</h2>
<div class="text-4xl font-extrabold text-indigo-600 mb-2" id="score-display">0 / 0</div>
<p class="text-sm text-slate-600 mb-6" id="pass-fail-text">合格基準: 60%以上</p>
<button onclick="retrySameQuestions()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg active:bg-emerald-700 transition mb-3">同じ問題に挑戦する</button>
<button onclick="restartQuiz()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:bg-indigo-700 transition">出題範囲選択画面に戻る</button>
</div>
<div class="mt-6 border-t pt-4">
<h3 class="font-bold text-slate-800 mb-3">解答と解説</h3>
<div id="review-container" class="space-y-4"></div>
</div>

<!-- 先頭へスクロールするボタン（結果画面のみ・少しスクロールすると表示） -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-full max-w-md px-4 flex justify-end pointer-events-none">
<button id="scroll-top-btn" type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" aria-label="一番上へ戻る" style="display:none" class="pointer-events-auto bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg active:bg-indigo-700 transition items-center justify-center">
<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
</button>
</div>
</div>
</main>

<!-- Footer Navigation -->
<footer class="p-4 bg-white border-t border-slate-100 sticky bottom-0 hidden" id="footer-nav">
<div class="flex gap-3">
<button id="prev-btn" onclick="prevQuestion()" class="flex-1 bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl active:bg-slate-300 transition disabled:opacity-50">前へ</button>
<button id="next-btn" onclick="onNextClick()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl active:bg-indigo-700 transition">次へ</button>
</div>
</footer>
</div>

<script>
// ==========================================
// 型定義（JSDoc）
// ==========================================
/**
 * @typedef {Object} Question
 * @property {string} tag
 * @property {string} question
 * @property {string[]} options
 * @property {number | number[]} correct  正解の選択肢インデックス（複数正解は配列）
 * @property {string} explanation
 * @property {string} [image]
 */
/** @typedef {number | number[] | null} UserAnswer  単一選択: number / 複数選択: number[] / 未回答: null */

// ==========================================
// 設定定数
// ==========================================
// true  : 問題をランダムに抽出する（シャッフルする）
// false : JSONに記述された順番のまま出題する
// ※画面からの切り替えは廃止。デバッグ用に定数として残している
const RANDOM_QUESTIONS = true;

const DEFAULT_QUESTION_FILE = 'questions.json';
const DEFAULT_QUESTION_COUNT = 10;
const RANGE_SIZE = 100;                     // 出題箇所の刻み幅
const PASS_THRESHOLD_PERCENT = 60;          // 合格ライン（%）
const SCROLL_TOP_BUTTON_THRESHOLD_PX = 300; // 先頭へ戻るボタンを表示するスクロール量

// プルダウンの値
const VALUE_ALL = 'all';
const CHECK_MODE_EACH = 'each';

// 画面の見た目（Tailwindクラス）
const CATEGORY_LABEL_CLASS_SELECTED = 'flex items-start p-3 border rounded-xl cursor-pointer transition border-indigo-600 bg-indigo-50/50';
const CATEGORY_LABEL_CLASS_DEFAULT = 'flex items-start p-3 border rounded-xl cursor-pointer transition border-slate-200 hover:bg-slate-50';

// 画面から変更される設定（カテゴリ選択画面のプルダウンで決まる）
const settings = {
questionCount: DEFAULT_QUESTION_COUNT, // 出題数（Infinity = すべて）
checkEach: true,                       // true: 1問ずつ確認 / false: まとめて確認（最後の結果画面で一括表示）
rangeStart: 0,                         // 出題箇所の開始位置（0始まり）
rangeEnd: Infinity                     // 出題箇所の終了位置（この位置は含まない）
};
// ==========================================

/** @type {Question[]} JSONから読み込んだ全問題 */
let allQuestions = [];
/** @type {Question[]} 今回出題する問題 */
let questions = [];
let currentIdx = 0;
/** @type {UserAnswer[]} */
let userAnswers = [];
/** @type {boolean[]} 1問ずつ確認モードで、その問題の正解を表示済みかどうか */
let revealed = [];

// ==========================================
// 共通ユーティリティ
// ==========================================
const $ = (id) => document.getElementById(id);

function setHidden(id, hidden) {
$(id).classList.toggle('hidden', hidden);
}

// Fisher-Yates シャッフル（偏りなく並べ替える。元の配列は変更しない）
function shuffleArray(arr) {
const a = [...arr];
for (let i = a.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}

// 共通：正解データを必ず配列の形（例: [1] や [1, 5]）に正規化するヘルパー関数
function getCorrectArray(correct) {
return Array.isArray(correct) ? correct : [correct];
}

// 正解が複数（correctが配列で要素数2以上）の問題か
function isMultipleChoice(q) {
return getCorrectArray(q.correct).length > 1;
}

// 未回答か（未選択、または複数選択で1つも選んでいない）
function isUnanswered(userAns) {
return userAns === null || userAns === undefined || (Array.isArray(userAns) && userAns.length === 0);
}

// 選択肢 idx がユーザーに選択されているか
function isOptionSelected(userAns, idx) {
return Array.isArray(userAns) ? userAns.includes(idx) : userAns === idx;
}

// ユーザーの回答が正解と一致しているかを判定する関数
function checkIsCorrect(userAns, correctDef) {
if (userAns === null || userAns === undefined) return false;
const correctArr = getCorrectArray(correctDef);

if (Array.isArray(userAns)) {
// ユーザーも複数選択（配列）の場合：要素が完全に一致しているか
if (userAns.length !== correctArr.length) return false;
return userAns.every(val => correctArr.includes(val)) && correctArr.every(val => userAns.includes(val));
} else {
// ユーザーが単一選択の場合：正解配列の中にその値が含まれているか
return correctArr.length === 1 && correctArr[0] === userAns;
}
}

// 回答状況の集計。revealedOnly が true なら正解表示済みの問題だけを対象にする
function calcAnswerStats(revealedOnly) {
let answered = 0;
let correct = 0;
questions.forEach((q, i) => {
if (revealedOnly && !revealed[i]) return;
answered++;
if (checkIsCorrect(userAnswers[i], q.correct)) correct++;
});
return { answered, correct };
}

// 進行状況（現在位置・回答・正解表示）を初期状態に戻す
function resetProgress() {
currentIdx = 0;
userAnswers = new Array(questions.length).fill(null);
revealed = new Array(questions.length).fill(false);
}

function createBadgeHtml(text, bgClass) {
return `<span class="text-xs ${bgClass} text-white px-2 py-0.5 rounded ml-2">${text}</span>`;
}

// ==========================================
// カテゴリ選択画面
// ==========================================
function parseQuestionCount(value) {
return value === VALUE_ALL ? Infinity : parseInt(value, 10);
}

// 出題箇所の値（"101-200" など）を 0始まりの範囲に変換する
function parseRangeValue(value) {
if (value === VALUE_ALL) return { start: 0, end: Infinity };
const [first, last] = value.split('-').map(Number);
return { start: first - 1, end: last };
}

// カテゴリ選択画面のプルダウンの内容を settings に反映する
function readSettingsFromForm() {
const countSelect = $('count-select');
settings.questionCount = countSelect ? parseQuestionCount(countSelect.value) : DEFAULT_QUESTION_COUNT;

const checkSelect = $('check-select');
settings.checkEach = checkSelect ? checkSelect.value === CHECK_MODE_EACH : true;

const rangeSelect = $('range-select');
const range = parseRangeValue(rangeSelect ? rangeSelect.value : VALUE_ALL);
settings.rangeStart = range.start;
settings.rangeEnd = range.end;
}

// カテゴリ選択画面で「試験を開始する」が押されたときの処理
function startWithSelectedCategory() {
const selected = document.querySelector('input[name="category"]:checked');
const fileName = selected ? selected.value : DEFAULT_QUESTION_FILE;

readSettingsFromForm();

setHidden('category-screen', true);
setHidden('quiz-screen', false);
setHidden('footer-nav', false);
$('question-text').innerText = "データを読み込んでいます...";
$('progress-info').innerText = "読み込み中...";

loadQuestions(fileName);
}

// カテゴリ選択画面のラジオボタンの見た目を選択状態に応じて更新
function updateCategoryHighlight() {
updateRangeOptions();
document.querySelectorAll('#category-options label').forEach(label => {
const input = label.querySelector('input[type="radio"]');
label.className = input.checked ? CATEGORY_LABEL_CLASS_SELECTED : CATEGORY_LABEL_CLASS_DEFAULT;
});
}

// 「出題箇所」の選択肢のHTMLを作る（RANGE_SIZE問刻み）
function buildRangeOptionsHtml(total) {
let html = `<option value="${VALUE_ALL}">すべて（1〜${total}番）</option>`;
for (let start = 1; start <= total; start += RANGE_SIZE) {
const end = Math.min(start + RANGE_SIZE - 1, total);
html += `<option value="${start}-${end}">${start}〜${end}番</option>`;
}
return html;
}

// 選択中のカテゴリの問題数に応じて「出題箇所」の選択肢を作る
async function updateRangeOptions() {
const sel = $('range-select');
const selected = document.querySelector('input[name="category"]:checked');
if (!sel || !selected) return;
sel.innerHTML = `<option value="${VALUE_ALL}">すべて</option>`;
try {
const total = (await fetchQuestionData(selected.value)).length;
if (total <= RANGE_SIZE) return;
sel.innerHTML = buildRangeOptionsHtml(total);
} catch (e) {
console.error(e);
}
}

// ==========================================
// 問題の読み込み・開始
// ==========================================
// 外部のJSONファイルから問題データを取得する
async function fetchQuestionData(fileName) {
const response = await fetch(fileName);
if (!response.ok) throw new Error('Network response was not ok');
return response.json();
}

// 外部のJSONファイルから問題を読み込む（引数で読み込むファイルを指定）
async function loadQuestions(fileName) {
try {
allQuestions = await fetchQuestionData(fileName);

if (allQuestions.length === 0) {
throw new Error('問題データが空です');
}

startQuiz();
} catch (error) {
$('question-text').innerText = "問題データの読み込みに失敗しました。\n(※ローカル環境で開く場合は簡易サーバー等をご利用ください)";
$('progress-info').innerText = "エラー";
console.error(error);
}
}

// クイズを開始
function startQuiz() {
// 出題箇所（範囲）で対象の問題を絞り込み、出題数だけ取り出す
const pool = allQuestions.slice(settings.rangeStart, settings.rangeEnd);
const ordered = RANDOM_QUESTIONS ? shuffleArray(pool) : pool;
questions = ordered.slice(0, settings.questionCount);

resetProgress();
renderQuestion();
}

// ==========================================
// 問題画面の描画
// ==========================================
function renderQuestion() {
if (questions.length === 0) return;
const q = questions[currentIdx];
// 1問ずつ確認モードで、この問題の正解を表示中か
const isRevealed = settings.checkEach && revealed[currentIdx];

renderProgress();
renderQuestionBody(q);
renderOptions(q, isRevealed);
renderFeedback(q, isRevealed);
renderNavButtons();
}

// 画面上部の進行状況（問題番号と、1問ずつ確認モードでは正解率）
function renderProgress() {
let progressText = `問題 ${currentIdx + 1} / ${questions.length}`;
if (settings.checkEach) {
// 正解を確認済みの問題だけで正解率を集計して表示
const { answered, correct } = calcAnswerStats(true);
const rate = answered > 0 ? Math.round(correct / answered * 100) + '%' : '-';
progressText += `　正解率 ${rate}（${correct}/${answered}）`;
}
$('progress-info').innerText = progressText;
}

// 問題文・タグ・画像
function renderQuestionBody(q) {
$('question-tag').innerText = q.tag;
$('question-text').innerText = q.question;

const imgWrap = $('question-image-wrap');
const imgEl = $('question-image');
if (q.image) {
imgEl.src = q.image;
imgWrap.classList.remove('hidden');
} else {
imgEl.removeAttribute('src');
imgWrap.classList.add('hidden');
}
}

// 正解表示中の選択肢の見た目：正解は緑、誤って選んだ選択肢は赤
function buildRevealedOptionStyle(isOptCorrect, isChecked) {
let stateClass = 'border-slate-200';
let badge = '';
if (isOptCorrect) {
stateClass = 'border-emerald-500 bg-emerald-50';
badge += createBadgeHtml('正解', 'bg-emerald-600');
} else if (isChecked) {
stateClass = 'border-rose-500 bg-rose-50';
}
if (isChecked) {
badge += createBadgeHtml('あなたの回答', isOptCorrect ? 'bg-indigo-600' : 'bg-rose-600');
}
return {
className: `flex items-start p-3 border rounded-xl cursor-default transition ${stateClass}`,
badge
};
}

// 回答中の選択肢の見た目
function buildSelectableOptionClass(isChecked) {
return `flex items-start p-3 border rounded-xl cursor-pointer transition ${isChecked ? 'border-indigo-600 bg-indigo-50/50' : 'border-slate-200 hover:bg-slate-50'}`;
}

// 選択肢の描画。正解が複数ある問題はチェックボックス（複数選択）、
// 正解が1つの問題はラジオボタン（単一選択）で表示する
function renderOptions(q, isRevealed) {
const container = $('options-container');
container.innerHTML = '';

const correctArr = getCorrectArray(q.correct);
const isMultiple = correctArr.length > 1;
const userAns = userAnswers[currentIdx];

q.options.forEach((opt, idx) => {
const isChecked = isOptionSelected(userAns, idx);
const { className, badge } = isRevealed
? buildRevealedOptionStyle(correctArr.includes(idx), isChecked)
: { className: buildSelectableOptionClass(isChecked), badge: '' };

const div = document.createElement('label');
div.className = className;

const inputType = isMultiple ? 'checkbox' : 'radio';
const inputName = isMultiple ? `option-${currentIdx}-${idx}` : `option-${currentIdx}`;
const inputClass = isMultiple
? 'mt-1 h-4 w-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500'
: 'mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500';

div.innerHTML = `
<input type="${inputType}" name="${inputName}" value="${idx}" ${isChecked ? 'checked' : ''} ${isRevealed ? 'disabled' : ''} onclick="selectOption(${idx})" class="${inputClass}">
<span class="ml-3 text-sm text-slate-700 leading-snug whitespace-pre-wrap">${opt}${badge}</span>
`;
container.appendChild(div);
});
}

// 1問ずつ確認モード：回答の正誤バナーの文言と色
function getFeedbackBanner(userAns, correctDef) {
if (isUnanswered(userAns)) {
return { text: '未回答', className: 'text-slate-700 bg-slate-100 border-slate-200' };
}
if (checkIsCorrect(userAns, correctDef)) {
return { text: '正解！', className: 'text-emerald-700 bg-emerald-50 border-emerald-200' };
}
return { text: '不正解', className: 'text-rose-700 bg-rose-50 border-rose-200' };
}

// 1問ずつ確認モード：回答の正誤と解説を表示
function renderFeedback(q, isRevealed) {
const feedback = $('feedback-container');
feedback.innerHTML = '';
if (!isRevealed) return;

const banner = getFeedbackBanner(userAnswers[currentIdx], q.correct);
feedback.innerHTML = `
<div id="feedback-banner" class="text-sm font-bold text-center py-2 rounded-xl border ${banner.className}">${banner.text}</div>
<div class="mt-3 text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100 leading-relaxed">
<span class="font-bold text-slate-700">解説:</span> ${q.explanation}
</div>
`;
}

// 「前へ」「次へ」ボタンの状態
// 最後の問題のボタン文言：まとめて確認なら常に「結果を確認する」。
// 1問ずつ確認なら、正解表示前は「次へ」、表示後に「結果を確認する」
function renderNavButtons() {
$('prev-btn').disabled = currentIdx === 0;
const isLast = currentIdx === questions.length - 1;
const showResultLabel = isLast && (!settings.checkEach || revealed[currentIdx]);
$('next-btn').innerText = showResultLabel ? "結果を確認する" : "次へ";
}

// ==========================================
// 操作ハンドラ
// ==========================================
// 「次へ」ボタン押下時の処理
function onNextClick() {
if (settings.checkEach && !revealed[currentIdx]) {
// 1問ずつ確認モードで正解未表示：回答と正解を表示する（まだ次の問題へは進まない）
revealed[currentIdx] = true;
renderQuestion();
const banner = $('feedback-banner');
if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
return;
}
if (currentIdx < questions.length - 1) {
nextQuestion();
} else {
submitQuiz();
}
}

function selectOption(idx) {
if (settings.checkEach && revealed[currentIdx]) return; // 正解表示後は回答を変更できない
const q = questions[currentIdx];

if (isMultipleChoice(q)) {
// 複数正解の問題：選択済みなら解除、未選択なら追加するトグル方式（配列で保存）
const current = Array.isArray(userAnswers[currentIdx]) ? userAnswers[currentIdx] : [];
const pos = current.indexOf(idx);
if (pos === -1) {
current.push(idx);
} else {
current.splice(pos, 1);
}
userAnswers[currentIdx] = current;
} else {
// 単一正解の問題：従来通り単一選択として保存
userAnswers[currentIdx] = idx;
}
renderQuestion();
}

// 別の問題へ移動する（前の問題のスクロール位置を引き継がない）
function moveToQuestion(newIdx) {
currentIdx = newIdx;
renderQuestion();
window.scrollTo({ top: 0 });
}

function nextQuestion() {
if (currentIdx < questions.length - 1) moveToQuestion(currentIdx + 1);
}

function prevQuestion() {
if (currentIdx > 0) moveToQuestion(currentIdx - 1);
}

// ==========================================
// 結果画面
// ==========================================
function submitQuiz() {
if (userAnswers.some(isUnanswered) && !confirm("未回答の問題がありますが、結果を確認しますか？")) {
return;
}

const { correct: score } = calcAnswerStats(false);

setHidden('quiz-screen', true);
setHidden('footer-nav', true);
setHidden('result-screen', false);

renderScore(score);
renderReview();
}

function renderScore(score) {
$('score-display').innerText = `${score} / ${questions.length}`;
const percentage = Math.round((score / questions.length) * 100);
$('pass-fail-text').innerText = percentage >= PASS_THRESHOLD_PERCENT
? `正答率: ${percentage}% - 合格ライン（${PASS_THRESHOLD_PERCENT}%）クリア！`
: `正答率: ${percentage}% - 合格ライン（${PASS_THRESHOLD_PERCENT}%）までもう少し！復習して再挑戦しましょう。`;
}

// 解答と解説の一覧を構築
function renderReview() {
const reviewContainer = $('review-container');
reviewContainer.innerHTML = '';
questions.forEach((q, idx) => reviewContainer.appendChild(createReviewCard(q, idx)));
}

function buildReviewOptionsHtml(q, userAns, isCorrect) {
const correctArr = getCorrectArray(q.correct);
return q.options.map((opt, optIdx) => {
const isOptCorrect = correctArr.includes(optIdx);
const isUserOpt = isOptionSelected(userAns, optIdx);

let badge = '';
if (isOptCorrect) badge += createBadgeHtml('正解', 'bg-emerald-600');
if (isUserOpt && !isCorrect) badge += createBadgeHtml('あなたの回答', 'bg-rose-600');

return `<li class="text-xs py-1 leading-relaxed ${isOptCorrect ? 'font-bold text-emerald-800' : 'text-slate-600'}">- ${opt} ${badge}</li>`;
}).join('');
}

function createReviewCard(q, idx) {
const userAns = userAnswers[idx];
const isCorrect = checkIsCorrect(userAns, q.correct);

const card = document.createElement('div');
card.className = `p-4 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'}`;
card.innerHTML = `
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-bold text-slate-500">問 ${idx + 1}</span>
<span class="text-xs font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${isCorrect ? '正解' : '不正解'}</span>
</div>
<p class="text-sm font-semibold text-slate-800 mb-2 whitespace-pre-wrap">${q.question}</p>
${q.image ? `<img src="${q.image}" alt="問題の図" class="w-full h-auto rounded-lg border border-slate-200 mb-2" onerror="this.style.display='none'">` : ''}
<ul class="mb-3 space-y-1">${buildReviewOptionsHtml(q, userAns, isCorrect)}</ul>
<div class="text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100 leading-relaxed">
<span class="font-bold text-slate-700">解説:</span> ${q.explanation}
</div>
`;
return card;
}

// 先頭へ戻るボタン：一定量スクロールしたら表示
window.addEventListener('scroll', () => {
const btn = $('scroll-top-btn');
if (!btn) return;
btn.style.display = window.scrollY > SCROLL_TOP_BUTTON_THRESHOLD_PX ? 'flex' : 'none';
});

// 同じ問題（同じ出題内容・同じ順序）でもう一度やり直す
function retrySameQuestions() {
if (questions.length === 0) return;
resetProgress();

setHidden('result-screen', true);
setHidden('quiz-screen', false);
setHidden('footer-nav', false);

renderQuestion();
window.scrollTo({ top: 0 });
}

function restartQuiz() {
setHidden('result-screen', true);
setHidden('quiz-screen', true);
setHidden('footer-nav', true);
setHidden('category-screen', false);
$('progress-info').innerText = "出題範囲を選択してください";
window.scrollTo({ top: 0, behavior: 'smooth' });
}

// アプリ起動時はカテゴリ選択画面を表示するだけで、
// 問題データの読み込みは startWithSelectedCategory() が呼ばれてから行う
// （出題箇所の選択肢だけ、問題数を調べるために先に読み込む）
updateRangeOptions();
</script>
</body>
</html>
